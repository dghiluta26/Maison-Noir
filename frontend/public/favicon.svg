<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    MAISON NOIR monogram favicon.
    Burgundy ground with a champagne hairline frame (as on the brand book cover)
    and a high-contrast Didone-style "M" drawn as paths, so it renders the same
    on every system without depending on installed fonts.
    Colours: Burgundy #641F32, Champagne #C5A77B, Ivory #F7F4EF.
  -->
  <rect width="64" height="64" rx="10" fill="#641F32"/>
  <rect x="5" y="5" width="54" height="54" rx="6" fill="none" stroke="#C5A77B" stroke-width="1.5"/>
  <g fill="#F7F4EF">
    <!-- thin left stem -->
    <rect x="17.2" y="18" width="2.2" height="28"/>
    <!-- thick left diagonal -->
    <polygon points="17.2,18 23.4,18 33.6,41.6 31.4,46"/>
    <!-- thin right diagonal -->
    <polygon points="30.6,46 32.4,46 45.8,18 44,18"/>
    <!-- thick right stem -->
    <rect x="42.2" y="18" width="5.6" height="28"/>
    <!-- hairline serifs -->
    <rect x="13.6" y="18" width="9.8" height="1.6"/>
    <rect x="13.6" y="44.4" width="9.4" height="1.6"/>
    <rect x="42.2" y="18" width="9" height="1.6"/>
    <rect x="39.2" y="44.4" width="12" height="1.6"/>
  </g>
  <!-- champagne underline accent -->
  <rect x="26" y="50" width="12" height="1.2" fill="#C5A77B"/>
</svg>
